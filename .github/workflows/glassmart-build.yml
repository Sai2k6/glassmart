name: Glassmart build

on:
  push:
    branches: ["main", "feature/complete-glassmart"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glassmart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glassmart/package-lock.json
      - run: npm ci
      - run: npm run build
