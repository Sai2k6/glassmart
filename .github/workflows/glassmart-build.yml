name: Glassmart build

on:
  push:
    branches: ["main", "feature/complete-glassmart"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glassmart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glassmart/package-lock.json
      - name: Connect hardware catalogue to Supabase
        run: python scripts/connect_hardware_supabase.py
      - name: Apply admin control centre
        run: python scripts/apply_admin_dashboard.py
      - name: Repair services page layout
        run: python scripts/fix_services_page.py
      - name: Rebuild services quote page
        run: python scripts/fix_services_quote_page.py
      - name: Commit generated app integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/App.css src/AdminDashboard.tsx src/hardwareSupabase.ts scripts/connect_hardware_supabase.py scripts/apply_admin_dashboard.py scripts/fix_services_page.py scripts/fix_services_quote_page.py
          git diff --cached --quiet || git commit -m "Rebuild services quote page [bot-fix]"
          git push
      - run: npm ci
      - run: npm run build
